name: Build Android APK

on:
  push:
    branches: [main, art-update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify puzzle outcomes
        run: |
          test_dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$test_dir" \
            app/src/main/java/com/doloreshazze/onesecond/PuzzleRound.java \
            .github/scripts/VerifyShots.java
          java -cp "$test_dir" com.doloreshazze.onesecond.VerifyShots
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify and name the APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" OneSecond-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-second-debug-apk
          path: OneSecond-debug.apk
          if-no-files-found: error
  smoke:
    name: Play both levels on Android 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: one-second-debug-apk
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and play the game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/smoke-game.sh artifacts/OneSecond-debug.apk
      - name: Upload gameplay screenshots
        uses: actions/upload-artifact@v4
        with:
          name: one-second-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
