name: Verify Android release

on:
  push:
    branches: [main, art-update, release-1.5.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SDKMANAGER" --licenses >/dev/null) || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check translations and offline privacy boundaries
        run: python3 .github/scripts/verify-release.py
      - name: Verify all puzzle outcomes
        run: |
          test_dir="$(mktemp -d)"
          javac -encoding UTF-8 -d "$test_dir" \
            app/src/main/java/com/doloreshazze/onesecond/PuzzleRound.java \
            app/src/main/java/com/doloreshazze/onesecond/WorkshopRound.java \
            app/src/main/java/com/doloreshazze/onesecond/FairRound.java \
            .github/scripts/VerifyShots.java
          java -cp "$test_dir" com.doloreshazze.onesecond.VerifyShots smoke-shots.tsv
      - name: Build APK and AAB and run release lint
        run: gradle assembleDebug assembleRelease bundleRelease lintRelease --no-daemon
      - name: Check packaged files
        run: |
          mkdir -p artifacts/distribution artifacts/test-inputs
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/distribution/OneSecond-1.5.0-release-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/distribution/OneSecond-1.5.0-release-unsigned.aab
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/test-inputs/OneSecond-debug.apk
          cp smoke-shots.tsv artifacts/test-inputs/
          python3 .github/scripts/verify-release.py \
            --artifacts artifacts/distribution \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --output artifacts/distribution/release-checks.json
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > artifacts/distribution/runtime-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: one-second-1.5.0-release-unsigned
          path: artifacts/distribution
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: one-second-test-inputs
          path: artifacts/test-inputs
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-second-lint
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  smoke:
    name: Test on Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: one-second-test-inputs
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: one-second-1.5.0-release-unsigned
          path: artifacts/distribution
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play and inspect the game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash .github/scripts/run-smoke.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-second-screenshots-api-${{ matrix.api }}
          path: |
            artifacts/screenshots
            artifacts/*log*.txt
          if-no-files-found: ignore
