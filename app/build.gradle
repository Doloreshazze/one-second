plugins { id 'com.android.application' }

android {
    namespace 'com.doloreshazze.onesecond'
    compileSdk 36

    defaultConfig {
        applicationId 'com.doloreshazze.onesecond'
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

