plugins { id 'com.android.application' }

android {
    namespace 'com.playeverywhere.onesecond'
    compileSdk 36

    defaultConfig {
        applicationId 'com.playeverywhere.onesecond'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '1.5.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

